; EmbSec ESP Firmware — supports ESP8266 and ESP32
; Build: pio run -e esp8266  or  pio run -e esp32
; Upload: pio run -e esp8266 -t upload --upload-port /dev/cu.*

[platformio]
default_envs = esp32

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
build_flags =
    -D ARDUINOJSON_USE_LONG_LONG=1

[env:esp8266]
platform = espressif8266
board = nodemcuv2
build_flags =
    ${env.build_flags}
    -D ESP8266
    -D PIO_ENV_ESP8266

[env:esp32]
platform = espressif32
board = esp32dev
build_flags =
    ${env.build_flags}
    -D ESP32
    -D PIO_ENV_ESP32

[env:esp32c3]
platform = espressif32
board = esp32c3dev
build_flags =
    ${env.build_flags}
    -D ESP32
